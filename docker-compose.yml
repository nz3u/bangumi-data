services:
  bangumi:
    # 构建前需先产出前端（web/dist 内嵌进二进制）：cd web && npm install && npm run build
    build: .
    container_name: bangumi
    ports:
      - "8080:8080"
    environment:
      BANGUMI_DB: /app/data/bangumi.db
      BANGUMI_LISTEN: ":8080"
    volumes:
      # 数据持久化：SQLite 文件
      - ./data:/app/data
    restart: unless-stopped

  # 一键下载最新导出并导入/更新（首次运行也会自动完成）
  #   docker compose run --rm update
  update:
    build: .
    profiles: ["tools"]
    volumes:
      - ./data:/app/data
    entrypoint: ["/app/bangumi", "update"]
    environment:
      BANGUMI_DB: /app/data/bangumi.db

  # 示例：导入数据（把 dump 放到 ./data/ 下）
  #   docker compose run --rm import /app/data/dump-xxx.zip
  import:
    build: .
    profiles: ["tools"]
    volumes:
      - ./data:/app/data
    entrypoint: ["/app/bangumi", "import", "-file"]
    command: ["/app/data/dump.zip"]
    environment:
      BANGUMI_DB: /app/data/bangumi.db