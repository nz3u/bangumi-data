info:
  contact:
    name: GitHub
    url: https://github.com/nz3u/bangumi-data
  description: |-
    本地化的 Bangumi 数据服务。利用 Archive 每周导出的 wiki 数据导入本地 SQLite，
    提供条目/人物/角色/章节等 REST 查询接口与单二进制管理接口。
    统一响应包装：成功 {"ok": true, "data": ...}；失败 {"ok": false, "error": "..."}。
    数据接口均为只读；管理接口（/api/admin/*）需要 X-Admin-Token 请求头（未配置 token 时放行）。
    交互式文档：/docs 或 /swagger/index.html；本文档由 swag 从代码注解自动生成（make docs）。
  license:
    name: AGPL-3.0
    url: https://www.gnu.org/licenses/agpl-3.0.html
  title: Bangumi 本地数据搜索 API
  version: "1.0"
paths:
  /api/admin/cancel:
    post:
      description: 请求取消当前正在进行的更新流程。需管理员 token（除非未配置）。
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.apiEnvelope'
        "401":
          description: token 无效
          schema:
            $ref: '#/definitions/api.apiEnvelope'
      security:
      - AdminToken: []
      summary: 取消更新
      tags:
      - 管理
  /api/admin/config:
    get:
      description: 返回当前生效的配置（含 EnsureDefaults 后的默认值）。需管理员 token（除非未配置）。
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/api.apiEnvelope'
            - properties:
                data:
                  $ref: '#/definitions/api.adminConfigData'
              type: object
        "401":
          description: token 无效
          schema:
            $ref: '#/definitions/api.apiEnvelope'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.apiEnvelope'
      security:
      - AdminToken: []
      summary: 读取配置
      tags:
      - 管理
    put:
      consumes:
      - application/json
      description: 按字段部分更新配置（传 nil 的字段保持不变），threads 需在 0-32 之间。需管理员 token（除非未配置）。
      parameters:
      - description: 配置字段（可选部分更新）
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/api.putConfigReq'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.apiEnvelope'
        "400":
          description: 请求体错误或参数越界
          schema:
            $ref: '#/definitions/api.apiEnvelope'
        "401":
          description: token 无效
          schema:
            $ref: '#/definitions/api.apiEnvelope'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.apiEnvelope'
      security:
      - AdminToken: []
      summary: 写入配置
      tags:
      - 管理
