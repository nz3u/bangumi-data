      tags:
      - 图片
  /api/stats:
    get:
      description: 返回 subjects/persons/characters/episodes 及各关联表的行数，用于确认导入状态。
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/api.apiEnvelope'
            - properties:
                data:
                  $ref: '#/definitions/api.statsData'
              type: object
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.apiEnvelope'
      summary: 各表行数统计
      tags:
      - 服务状态
  /api/stats/stream:
    get:
      description: text/event-stream，事件名 stats，30s 间隔，首包即时。保留兼容，新逻辑请用 /api/system/stream。
      produces:
      - text/event-stream
      responses:
        "200":
          description: SSE 流（事件 stats）
          schema:
            type: string
      summary: 表行数统计 SSE 推送
      tags:
      - 服务状态
  /api/subjects/{id}:
    get:
      description: 含基本信息、infobox、简介、双向关联、制作人员、角色与章节数。
      parameters:
      - description: 条目 ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/api.apiEnvelope'
            - properties:
                data:
                  $ref: '#/definitions/api.subjectDetail'
              type: object
        "400":
          description: 无效的 id
          schema:
            $ref: '#/definitions/api.apiEnvelope'
        "404":
          description: 条目不存在
          schema:
            $ref: '#/definitions/api.apiEnvelope'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.apiEnvelope'
      summary: 条目详情
      tags:
      - 条目
  /api/subjects/{id}/episodes:
    get:
      description: 字段含义同 Archive 的 episode 表：sort=集数、disc=所在光盘、airdate=播出时间、duration=时长、type=章节类型（0
        正篇 / 1 SP / 2 OP / 3 ED / 4 Trailer / 5 MAD / 6 其他）。
      parameters:
      - description: 条目 ID
        in: path
        name: id
        required: true
        type: integer
      - description: 章节类型过滤
        enum:
        - 0
        - 1
        - 2
        - 3
        - 4
        - 5
        - 6
        in: query
        name: type
        type: integer
      - description: type=按章节类型分组排序（正篇在前）；省略=按集数
        enum:
        - type
        in: query
        name: sort
        type: string
      - default: 1
        description: 页码
        in: query
        name: page
        type: integer
      - default: 30
        description: 每页数量
        in: query
        name: size
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/api.apiEnvelope'
            - properties:
                data:
                  $ref: '#/definitions/api.subjectEpisodesData'
              type: object
        "400":
          description: 无效的 id
          schema:
            $ref: '#/definitions/api.apiEnvelope'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.apiEnvelope'
      summary: 条目章节列表
      tags:
      - 条目
  /api/subjects/search:
    get:
      description: q 经符号归一化后匹配原名、中文名与 infobox 别名（「少女歌剧」可命中「少女☆歌剧」）；tag 同时匹配普通标签与元标签，支持多标签组合
        `+奇幻,-科幻`（必须包含/必须排除，逗号分隔，无前缀视为必须包含）；sort 留空时有关键词按匹配分级+人气、无关键词按 ID。
      parameters:
      - description: 关键词（全文搜索，中文子串匹配）
        in: query
        name: q
        type: string
      - description: 作品类型：1 书籍 / 2 动画 / 3 音乐 / 4 游戏 / 6 三次元
        in: query
        name: type
        type: integer
      - description: 子类型（平台）ID，取值见 /api/constants
        in: query
        name: platform
        type: integer
      - description: 标签组合，如 +奇幻,-科幻
        in: query
        name: tag
        type: string
      - description: 元标签组合（保留兼容，同 tag 语法，仅查元标签）
        in: query
        name: meta_tag
        type: string
      - description: 排名下界（含）
        in: query
        name: rank_min
        type: integer
      - description: 评分下界（含）
        in: query
        name: score_min
        type: number
      - description: 发售/播出日期下界（YYYY-MM-DD）
        in: query
        name: date_from
        type: string
      - description: 发售/播出日期上界
        in: query
        name: date_to
        type: string
      - description: 0=非 R18，1=仅 R18
        enum:
        - 0
        - 1
        in: query
        name: nsfw
        type: integer
      - description: 0=非系列，1=系列
        enum:
        - 0
        - 1
        in: query
        name: series
        type: integer
      - description: 排序字段：id / rank / score / date / favorite，省略=智能排序
        in: query
        name: sort
        type: string
      - default: asc
        description: 排序方向
        enum:
        - asc
        - desc
        in: query
        name: order
        type: string
      - default: 1
        description: 页码，从 1 起
        in: query
        name: page
        type: integer
      - default: 30
        description: 每页数量，1-200
        in: query
        name: size
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/api.apiEnvelope'
            - properties:
                data:
                  $ref: '#/definitions/api.subjectSearchData'
              type: object
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.apiEnvelope'
      summary: 条目搜索与筛选
      tags:
      - 条目
  /api/subjects/tags:
    get:
      description: 按使用次数降序返回候选（前缀命中优先于子串命中）；kind=all 合并普通标签与元标签两张聚合表并按名称去重。
      parameters:
      - default: all
        description: 建议类型
        enum:
        - tag
        - meta
        - all
        in: query
        name: kind
        type: string
      - description: 子串过滤（ASCII 大小写不敏感）
        in: query
        name: q
        type: string
      - default: 50
        description: 返回上限，1-5000
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/api.apiEnvelope'
            - properties:
                data:
                  $ref: '#/definitions/api.subjectTagsData'
              type: object
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.apiEnvelope'
      summary: 条目标签/元标签实时建议
      tags:
      - 条目
  /api/system/stream:
    get:
      description: text/event-stream，事件名 system，载荷 {"health":{...},"stats":{...}}，30s
        间隔，首包即时。
      produces:
      - text/event-stream
      responses:
        "200":
          description: SSE 流（事件 system）
          schema:
            type: string
      summary: 健康状态与表行数合并 SSE 推送
      tags:
      - 服务状态
securityDefinitions:
  AdminToken:
    in: header
    name: X-Admin-Token
    type: apiKey
swagger: "2.0"
