        - 4
        - 5
        - 6
        in: query
        name: ep_type
        type: integer
      - description: 光盘号
        in: query
        name: disc
        type: integer
      - description: 播出时间下界
        in: query
        name: airdate_from
        type: string
      - description: 播出时间上界
        in: query
        name: airdate_to
        type: string
      - description: 排序：id / sort=集数 / airdate=播出日期 / subject=条目 / popularity=条目人气，省略=智能排序
        in: query
        name: sort
        type: string
      - default: asc
        description: 排序方向
        enum:
        - asc
        - desc
        in: query
        name: order
        type: string
      - default: 1
        description: 页码
        in: query
        name: page
        type: integer
      - default: 30
        description: 每页数量
        in: query
        name: size
        type: integer
