# Dependabot 自动依赖升级
# 计划：每 3 个月扫描一次（1 月 / 4 月 / 7 月 / 10 月的 1 日 03:00 UTC）
# 升级以 PR 形式提交，由 .github/workflows/ci.yml 自动验证，合并需手动确认
version: 2
updates:
  # GitHub Actions 版本（解决 Node20 运行时弃用等升级）
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: cron
      cronjob: '0 3 1 */3 *'
    open-pull-requests-limit: 10

  # Go 模块依赖（go.mod / go.sum）
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: cron
      cronjob: '0 3 1 */3 *'
    open-pull-requests-limit: 10

  # 前端 npm 依赖
  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: cron
      cronjob: '0 3 1 */3 *'
    open-pull-requests-limit: 10
