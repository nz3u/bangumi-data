# 预览环境流水线：push 到 main 自动构建 Docker 镜像并推送
# 镜像标签：preview-<commit-sha 前 7 位>，用于部署预览环境
name: Preview

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write   # 推送 ghcr.io 镜像

concurrency:
  group: preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------- 1. 前端构建 ----------
  frontend:
    name: Build frontend (web/dist)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: npm ci && build
        working-directory: web
        run: |
          npm ci
          npm run build

      - name: Upload web/dist artifact
        uses: actions/upload-artifact@v7
        with:
          name: web-dist
          path: web/dist/
          retention-days: 1
          if-no-files-found: error

  # ---------- 2. Docker 镜像 → ghcr.io ----------
  docker:
    name: Docker image (preview)
    needs: frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Download web/dist
        uses: actions/download-artifact@v8
        with:
          name: web-dist
          path: web/dist

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to ghcr.io
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha,prefix=preview-,format=short

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=preview-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
